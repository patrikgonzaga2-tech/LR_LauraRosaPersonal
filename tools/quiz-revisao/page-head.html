<title>Ajuste do Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<style>
/* Layout: igual ao Painel Volta ao Eixo — menu verde-escuro à esquerda com abas (no celular vira faixa no topo), conteúdo em fundo claro, aba ativa laranja. Tema único e claro, de propósito: são as cores da marca. */
:root{
  color-scheme:light;
  --o:#F57100; --od:#C54E00; --o-soft:#FFF1E5;
  --g:#1C873C; --gd:#004811; --g-soft:#E8F4EC;
  --bg:#F7F5F2; --panel:#FFFFFF; --ink:#1A1A1A; --sub:#555; --mute:#888; --line:#E8E3DC;
  --accent:#F57100; --accent-ink:#000; --accent-soft:#FFF1E5;
  --ok:#1C873C; --ok-soft:#E8F4EC; --warn:#9A5B00; --warn-soft:#FFF4DC; --bad:#B8382B; --bad-soft:#FBE9E6;
  --device:#16130F;
  --f-display:'Bricolage Grotesque',ui-sans-serif,system-ui,sans-serif;
  --f-body:'DM Sans',ui-sans-serif,system-ui,sans-serif;
  --f-mono:'DM Sans',ui-sans-serif,system-ui,sans-serif;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);margin:0}
.wrap{display:grid;gap:18px}
/* Casca do app (menu verde + conteúdo) */
.app{min-height:100dvh;display:flex}
.app>aside{width:232px;flex-shrink:0;background:var(--gd);color:#fff;position:sticky;top:0;height:100dvh;display:flex;flex-direction:column}
.brand{padding:18px 20px 14px;font-family:var(--f-display);font-weight:800;font-size:19px;line-height:1.15}
.brand span{color:var(--o)}
.brand small{display:block;font:600 11.5px var(--f-body);color:rgba(255,255,255,.55);margin-top:4px}
.app nav{padding:4px 12px 12px;display:flex;flex-direction:column;gap:2px}
.navlbl{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:rgba(255,255,255,.45);padding:10px 10px 4px}
.app nav button{all:unset;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;border-radius:9px;padding:9px 12px;font-weight:700;font-size:14px;color:rgba(255,255,255,.85);white-space:nowrap}
.app nav button:hover{background:rgba(255,255,255,.08)}
.app nav button[aria-selected="true"]{background:var(--o);color:#000}
.app nav button:focus-visible{outline:2px solid #fff;outline-offset:1px}
.badge{min-width:22px;text-align:center;font-size:12px;border-radius:99px;padding:1px 7px;background:rgba(255,255,255,.18);color:#fff}
.app nav button[aria-selected="true"] .badge{background:#000;color:#fff}
.side-foot{margin-top:auto;padding:14px 20px;font-size:12px;color:rgba(255,255,255,.6);display:grid;gap:4px}
.side-foot b{color:#fff}
.side-links{padding:6px 12px 0;display:grid;gap:2px}
.side-links a{display:flex;align-items:center;justify-content:space-between;gap:8px;border-radius:9px;padding:8px 12px;font-weight:700;font-size:13.5px;color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.22)}
.side-links a:hover{background:rgba(255,255,255,.1)}
.side-links a:focus-visible{outline:2px solid #fff;outline-offset:1px}
.xlinks{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.xlink{display:inline-flex;align-items:center;gap:6px;font:700 13.5px var(--f-body);text-decoration:none;color:#000;background:var(--o);border:1px solid var(--o);border-radius:10px;padding:8px 13px}
.xlink:hover{filter:brightness(1.06)}
.xlink.sec{background:var(--panel);color:var(--ink);border-color:var(--line)}
.xlink.sec:hover{border-color:var(--sub)}
.app main{flex:1;min-width:0;padding-inline:28px;padding-block:24px 64px}
.inner{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.tab[hidden]{display:none!important}
#editar>*,.grid>*{min-width:0}
@media (max-width:860px){
  .app{display:block}
  .app>aside{width:auto;height:auto;position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
  .brand{padding:12px 16px 6px;font-size:17px}
  .brand small,.navlbl,.side-foot{display:none}
  .side-links{display:flex;gap:6px;padding:0 12px 8px;overflow-x:auto}
  .side-links a{padding:5px 10px;font-size:12.5px;white-space:nowrap}
  .app nav{flex-direction:row;overflow-x:auto;padding:4px 12px 10px;gap:4px}
  .app main{padding-inline:16px}
}
header.top{display:flex;flex-wrap:wrap;gap:10px 24px;align-items:flex-end;justify-content:space-between}
h1{font:800 clamp(22px,3vw,30px)/1.1 var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1 span{color:var(--accent)}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--sub);font-size:13px}
.meta code{font:12px var(--f-mono);background:var(--panel);border:1px solid var(--line);padding:1px 6px;border-radius:5px;color:var(--ink)}
.notice{font-size:13.5px;color:var(--sub);max-width:70ch;margin:0}
.grid{display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:880px){.grid{grid-template-columns:minmax(0,1fr)}}
/* Coluna pública */
.pub{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);display:grid;gap:10px;justify-items:center}
@media (max-width:880px){.pub{position:static}}
.lbl{font:700 12px/1.2 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.device{width:100%;max-width:390px;aspect-ratio:390/780;background:var(--device);border-radius:38px;padding:10px;box-shadow:0 20px 40px -24px rgba(0,0,0,.45)}
.device iframe{width:100%;height:100%;border:0;border-radius:29px;background:#F7F5F2;display:block}
.nav{display:flex;gap:8px;align-items:center;width:100%;max-width:390px}
.nav select{flex:1;min-width:0;font:500 14px var(--f-body);padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
button{font:700 13.5px var(--f-body);cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:9px 14px}
button:hover{border-color:var(--sub)}
button:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.primary:disabled{opacity:.45;cursor:default}
button.icon{padding:9px 12px}
.hint{font-size:12.5px;color:var(--sub);text-align:center;max-width:390px;margin:0}
/* Coluna editável */
.edit{background:var(--panel);border:1px solid rgba(0,0,0,.07);box-shadow:0 4px 16px rgba(0,0,0,.04);border-radius:16px;padding:20px;display:grid;gap:18px;min-width:0}
.edit-head{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between}
.edit-head h2{font:700 20px/1.25 var(--f-display);margin:0;text-wrap:balance;flex:1 1 320px}
.tno{font:600 12px var(--f-mono);color:var(--accent)}
.callout{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:13.5px}
.fields{display:grid;gap:12px}
.f{display:grid;gap:4px}
.f label{font-size:12.5px;font-weight:700;color:var(--sub);display:flex;gap:8px;align-items:center}
.f.sub label{padding-left:14px;font-weight:500}
.f textarea{width:100%;resize:vertical;font:15px/1.45 var(--f-body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:8px 10px;min-height:40px}
.f.sub textarea{margin-left:14px;width:calc(100% - 14px);font-size:14px}
.f.changed textarea{border-color:var(--accent);background:var(--accent-soft)}
.pill{font:600 10.5px var(--f-mono);letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:99px}
.pill.saved{background:var(--ok-soft);color:var(--ok)}
.pill.draft{background:var(--accent-soft);color:var(--accent)}
.orig{font-size:12.5px;color:var(--sub);margin:0}
.orig s{opacity:.8}
.f .undo{margin-left:auto;padding:2px 8px;font-size:12px;border-radius:7px}
.free textarea{min-height:84px}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);background:var(--panel);padding-top:8px}
.status{font-size:13px;color:var(--sub)}
.queue{display:grid;gap:8px}
.queue h3{font:700 16px var(--f-display);margin:0}
.qitem{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;padding:10px 0;border-top:1px solid var(--line);font-size:13.5px}
.qitem .tno{padding-top:2px}
.qitem b{font-weight:700}
.qitem p{margin:0;overflow-wrap:anywhere}
.qitem a{color:var(--accent);cursor:pointer;text-decoration:underline}
.empty{color:var(--sub);font-size:13.5px;margin:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
